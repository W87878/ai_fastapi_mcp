<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>MCP AI 問答</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(10px);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #00c9ff;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #0096c7;
    }

    h3 {
      margin-top: 30px;
      font-size: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    pre {
      white-space: pre-wrap;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #f1f1f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🤖 MCP AI 問答助手</h2>
    <input type="text" id="question" placeholder="請輸入你的問題，例如：5 加上 3 是多少？"/>
    <button onclick="askAI()">🚀 送出問題</button>

    <h3>🧠 AI 回覆：</h3>
    <pre id="response">尚未查詢</pre>
  </div>

  <script>
    async function askAI() {
      const question = document.getElementById("question").value;
      document.getElementById("response").textContent = "等待 AI 回覆中...";

      try {
        const res = await fetch("http://localhost:8001/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        document.getElementById("response").textContent = data.response || data.error || "⚠️ 無法取得回應";
      } catch (error) {
        document.getElementById("response").textContent = "❌ 請求失敗：" + error.message;
      }
    }
  </script>
</body>
</html>
